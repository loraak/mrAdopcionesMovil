<ion-content class="profile-content ion-padding">

  <!-- Encabezado del Perfil -->
  <div class="profile-header ion-text-center ion-margin-bottom">
    <img src="assets/img/gatotriste.png" alt="Avatar" class="profile-avatar" />
    <h2 class="profile-name">{{ user.name }}</h2>
    <span class="badge-pink role-badge">{{ user.role }}</span>
  </div>

  <!-- Información General (Ambos Roles) -->
  <ion-card class="info-card">
    <ion-card-content>
      <ion-item lines="none">
        <ion-icon name="mail-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h3>Correo</h3>
          <p>{{ user.email }}</p>
        </ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-icon name="call-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h3>Teléfono</h3>
          <p>{{ user.phone }}</p>
        </ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <!-- Información y Catálogo Exclusivo para DONANTES -->
  @if (user.role === 'DONANTE') {

  <!-- Info Extra -->
  <ion-card class="info-card">
    <ion-card-content>
      <ion-item lines="none">
        <ion-icon name="location-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h3>Ubicación</h3>
          <p>{{ user.location }}</p>
        </ion-label>
      </ion-item>
      <ion-item lines="none">
        <ion-icon name="business-outline" slot="start" color="primary"></ion-icon>
        <ion-label>
          <h3>Organización</h3>
          <p>{{ user.organization }}</p>
        </ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>
  }
</ion-content>
