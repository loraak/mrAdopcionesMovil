<!-- Header Nivel App -->
<ion-header class="ion-no-border">
  <ion-toolbar style="--background: #D81B60; --color: #ffffff;">
    <ion-title slot="start" class="brand-title">
      <img src="assets/icon/mrfresh.png" class="header-logo" alt="Logo" />
      <span>Mr Adopciones</span>
    </ion-title>

    <ion-buttons slot="end">
      @if (isLoggedIn) {
        <ion-button id="profile-btn" aria-label="Menú de perfil">
          <ion-icon slot="icon-only" name="person-circle-outline"></ion-icon>
        </ion-button>

        <ion-popover trigger="profile-btn" triggerAction="click" [dismissOnSelect]="true">
          <ng-template>
            <ion-content>
              <ion-list lines="none">
                <ion-item>
                  <ion-label>
                    <h3>{{ username }}</h3>
                    <p>{{ rolLabel }}</p>
                  </ion-label>
                </ion-item>
                <ion-item button [detail]="false" routerLink="/app/perfil">
                  <ion-icon slot="start" name="person-outline"></ion-icon>
                  <ion-label>Mi perfil</ion-label>
                </ion-item>
                <ion-item button [detail]="false" (click)="logout()">
                  <ion-icon slot="start" name="log-out-outline"></ion-icon>
                  <ion-label>Cerrar sesión</ion-label>
                </ion-item>
              </ion-list>
            </ion-content>
          </ng-template>
        </ion-popover>
      } @else {
        <ion-button class="white" routerLink="/login">
          Iniciar Sesión
        </ion-button>
      }
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content">
  <ion-router-outlet></ion-router-outlet>
</ion-content>

<ion-tab-bar slot="bottom" class="custom-tab-bar">
  <ion-tab-button tab="home" routerLink="/app/home">
    <ion-icon name="home-outline"></ion-icon>
    <ion-label>Inicio</ion-label>
  </ion-tab-button>

  <ion-tab-button tab="catalog" routerLink="/app/catalogo">
    <ion-icon name="paw-outline"></ion-icon>
    <ion-label>Catálogo</ion-label>
  </ion-tab-button>

  <!-- Solo para donantes -->
  @if (isDonante) {
    <ion-tab-button tab="my-pets" routerLink="/app/mascota">
      <ion-icon name="heart-outline"></ion-icon>
      <ion-label>Mis mascotas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="requests" routerLink="/app/solicitud-adopcion">
      <ion-icon name="document-text-outline"></ion-icon>
      <ion-label>Solicitudes</ion-label>
    </ion-tab-button>
  }

  <ion-tab-button tab="about-us" routerLink="/app/nosotros">
    <ion-icon name="information-circle-outline"></ion-icon>
    <ion-label>Nosotros</ion-label>
  </ion-tab-button>
</ion-tab-bar>
